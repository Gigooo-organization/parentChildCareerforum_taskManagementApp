[tools]
node = "22"
pnpm = "12.4.2"
direnv = "2.37.1"

[tasks.setup]
description = "Install project dependencies from the lockfile"
run = "pnpm install --frozen-lockfile"

[tasks.dev]
description = "Start the workshop app and its preview"
run = "pnpm dev"

[tasks.check]
description = "Run tests, type checks, lint, formatting checks, and build"
run = [
  "pnpm test --run",
  "pnpm vize:check",
  "pnpm vize:lint",
  "pnpm vize:fmt",
  "pnpm build",
]
